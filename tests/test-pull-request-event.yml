name: Test stoat action - pull request event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          pr_branch_name: feature-branch
          actual_sha: deadbeef1234567890abcdef1234567890abcdef
          run_id: "99999"
          run_number: "5"
          run_attempt: "2"
          job_status: success
      - name: Assert action ran (completed or failed gracefully)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          OUTCOME="${{ steps.action.outcome }}"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome is empty"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
