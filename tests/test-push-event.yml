name: Test stoat action - push event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          pr_branch_name: main
          actual_sha: abc1234567890abcdef1234567890abcdef123456
          run_id: "12345"
          run_number: "1"
          run_attempt: "1"
          job_status: success
      - name: Assert action ran (completed or failed gracefully)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to network calls to Stoat API, but it should
          # not crash with an unhandled exception at the input parsing stage.
          # We accept both 'success' and 'failure' as valid outcomes here,
          # but not 'cancelled' or missing.
          OUTCOME="${{ steps.action.outcome }}"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome is empty"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
