name: Test default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # Use all default inputs - token defaults to github.token,
        # pr_branch_name defaults to github.head_ref || github.ref_name,
        # actual_sha defaults to github.event.pull_request.head.sha || github.sha,
        # run_attempt defaults to github.run_attempt,
        # job_status defaults to job.status,
        # run_matrix defaults to toJSON(matrix)
        continue-on-error: true
      - name: Assert action completed (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
