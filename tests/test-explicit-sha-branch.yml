name: Test explicit sha and branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get current SHA
        id: git-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=act-harness" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          pr_branch_name: ${{ steps.git-info.outputs.branch }}
          actual_sha: ${{ steps.git-info.outputs.sha }}
          run_attempt: '1'
          job_status: success
      - name: Assert action ran without unexpected crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to missing Stoat config or API errors,
          # but it should not produce an unknown/skipped outcome.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran with explicit sha/branch (outcome=$OUTCOME)"
