name: Test Stoat minimal valid config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal valid stoat config (disabled)
        run: |
          mkdir -p .stoat
          cat > .stoat/config.yaml << 'EOF'
          version: 1
          EOF

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          job_status: success
        continue-on-error: true

      - name: Assert action ran (may fail on API calls but should not fail on config validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because it tries to call the Stoat API,
          # but it should NOT fail due to config validation errors.
          # We just verify the action ran (either success or failure from API calls).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with minimal config (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
